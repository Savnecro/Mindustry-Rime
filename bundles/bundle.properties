sector.ice-expansion-rime-glacial-frontier.name = Glacial Frontier
sector.ice-expansion-rime-glacial-frontier.description = An isolated frozen frontier rich in Cryolite. Secure the deposits to open the Rime resource chain.
sector.ice-expansion-rime-glacial-frontier.details = Glacial Frontier is the first Rime campaign sector on Serpulo.

sector.ice-expansion-rime-permafrostBasin.name = Permafrost Basin
sector.ice-expansion-rime-permafrostBasin.description = Deep glacial basins contain rich seams of Cryolite. Establish outposts and hold the northern approaches to unlock Polar Forge.
sector.ice-expansion-rime-permafrostBasin.details = Part of the Rime campaign expansion on Serpulo.

sector.ice-expansion-rime-cryoliteExpanse.name = Cryolite Expanse
sector.ice-expansion-rime-cryoliteExpanse.description = A vast mineral plain with heavy Cryolite deposits and surface oil fields. Secure the sector as a permanent export and industry hub.
sector.ice-expansion-rime-cryoliteExpanse.details = Part of the Rime campaign expansion on Serpulo.

sector.ice-expansion-rime-zeroPoint.name = Zero Point
sector.ice-expansion-rime-zeroPoint.description = A frozen fault-line conceals enormous reserves and an apex siege machine. Survive the final assault of the Singularity Walker.
sector.ice-expansion-rime-zeroPoint.details = Part of the Rime campaign expansion on Serpulo.

