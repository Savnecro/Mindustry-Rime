sector.ice-expansion-rime-glacialFrontier.description = An isolated frozen frontier rich in Cryolite. Secure the deposits to open the Rime resource chain.
sector.ice-expansion-rime-glacialFrontier.details = First sector of the Rime campaign expansion on Serpulo.

